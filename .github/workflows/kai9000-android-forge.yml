name: KAI 9000 Android Forge

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - kai9000-sanctuary-forge
    paths:
      - "kai9000/**"
      - ".github/workflows/kai9000-android-forge.yml"
  pull_request:
    paths:
      - "kai9000/**"
      - ".github/workflows/kai9000-android-forge.yml"

permissions:
  contents: read

concurrency:
  group: kai9000-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-apk:
    name: Compile Samsung Android 16 APK
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout forge branch
        uses: actions/checkout@v5

      - name: Install Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python 3 project preflight
        shell: bash
        run: |
          set -euxo pipefail
          python --version
          python kai9000/tools/ci_preflight.py

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android 16 / API 36 packages
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "cmdline-tools;latest"

      - name: Generate ephemeral debug keystore
        shell: bash
        run: |
          set -euxo pipefail
          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/kai9000-debug.keystore" \
            -storepass android \
            -alias androiddebugkey \
            -keypass android \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=KAI 9000 Debug,O=Professor,C=US"

      - name: Export Godot 4.7.1 Android APK
        id: export
        uses: firebelley/godot-export@v8.0.0
        env:
          GODOT_ANDROID_KEYSTORE_DEBUG_PATH: ${{ runner.temp }}/kai9000-debug.keystore
          GODOT_ANDROID_KEYSTORE_DEBUG_USER: androiddebugkey
          GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD: android
        with:
          godot_executable_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot-builds/releases/download/4.7.1-stable/Godot_v4.7.1-stable_export_templates.tpz
          relative_project_path: ./kai9000
          presets_to_export: Android
          export_debug: true
          cache: true
          verbose: true

      - name: Collect APK and checksum
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p forge-output
          echo "Godot raw build directory: ${{ steps.export.outputs.build_directory }}"
          find "${{ steps.export.outputs.build_directory }}" -type f -maxdepth 5 -print || true
          APK="$(find "${{ steps.export.outputs.build_directory }}" -type f -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" forge-output/kai9000-sanctuary-debug.apk
          sha256sum forge-output/kai9000-sanctuary-debug.apk \
            | tee forge-output/kai9000-sanctuary-debug.apk.sha256

      - name: Upload Samsung APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: kai9000-sanctuary-samsung-android16
          path: |
            forge-output/kai9000-sanctuary-debug.apk
            forge-output/kai9000-sanctuary-debug.apk.sha256
            forge-output/preflight.json
            forge-output/manifest.b64
          if-no-files-found: error
          retention-days: 14
